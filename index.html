<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Modelado y Simulación Ambiental</title>
  <style>
    :root{--bg:#f6f8f7;--fg:#13201e;--acc:#083d39;--card:#fff;--line:#d9e2df}
    @media (prefers-color-scheme:dark){:root{--bg:#0f1715;--fg:#e6eeec;--acc:#5fc4b5;--card:#17211f;--line:#2a3734}}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;line-height:1.5}
    main{max-width:760px;margin:0 auto;padding:32px 16px}
    h1{color:var(--acc);margin:0 0 4px}
    p{margin:0 0 24px;opacity:.8}
    ul{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
    a{display:block;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:10px;
      color:var(--fg);text-decoration:none;font-weight:600}
    a:hover{border-color:var(--acc)}
  </style>
</head>
<body>
  <main>
    <h1>Modelado y Simulación Ambiental</h1>
    <p>Centro Universitario de Tlajomulco · Guías de estudio · Cada guía pide la clave de la materia.</p>

      <li><a href="tema-06/">Semana 6</a></li>
      <li><a href="tema-07/">Semana 7</a></li>
    </ul>
  </main>
</body>
</html>
